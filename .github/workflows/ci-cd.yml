name: Medical AI System CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: "ghcr.io/medical-ai/scoliosis-diagnosis-system"
  REGISTRY: "ghcr.io"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 1: Continuous Integration - Linting & SAST Security
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & SAST Security Inspection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black bandit

      - name: Syntax & Formatting Lint (Flake8 — Blocking Gate)
        run: |
          SRC_DIR="."
          if [ -d "Codigo" ]; then SRC_DIR="Codigo"; fi
          flake8 $SRC_DIR/services $SRC_DIR/domain $SRC_DIR/pipeline $SRC_DIR/api $SRC_DIR/ai --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 $SRC_DIR/ --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      - name: Static Application Security Testing (Bandit — Blocking Gate on Medium/High)
        run: |
          SRC_DIR="."
          if [ -d "Codigo" ]; then SRC_DIR="Codigo"; fi
          bandit -r $SRC_DIR/services $SRC_DIR/api $SRC_DIR/pipeline $SRC_DIR/ai -ll -ii --exclude $SRC_DIR/tests

  # ─────────────────────────────────────────────────────────────
  # Stage 2: Continuous Integration - Automated Testing & Coverage Gate
  # ─────────────────────────────────────────────────────────────
  test:
    name: Unit, Integration, Profiling & System Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install System Dependencies for Imaging
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0

      - name: Install Project Dependencies
        run: |
          SRC_DIR="."
          if [ -d "Codigo" ]; then SRC_DIR="Codigo"; fi
          python -m pip install --upgrade pip
          pip install -r $SRC_DIR/requirements.txt
          pip install pytest pytest-cov httpx psutil

      - name: Run Test Suite with Coverage Gate (>= 75%)
        run: |
          if [ -d "Codigo" ]; then cd Codigo; fi
          pytest -v \
            --cov=services \
            --cov=pipeline \
            --cov=domain \
            --cov=api \
            --cov=infrastructure \
            --cov=ai \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=75 \
            --junitxml=test-results.xml \
            tests/

      - name: Verify Memory Profiling Budget
        run: |
          if [ -d "Codigo" ]; then cd Codigo; fi
          pytest -v -s tests/profiling/test_memory_profiling.py

  # ─────────────────────────────────────────────────────────────
  # Stage 3: Containerization - Docker Build & Trivy CVE Security Gate
  # ─────────────────────────────────────────────────────────────
  build-container:
    name: Build Docker Container & Scan Vulnerabilities
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build Production Container Image
        run: |
          SRC_DIR="."
          if [ -d "Codigo" ]; then SRC_DIR="Codigo"; fi
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest $SRC_DIR

      - name: Container Security Vulnerability Scan (Trivy — Blocks on Fixable CRITICAL CVEs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

  # ─────────────────────────────────────────────────────────────
  # Stage 4: Continuous Delivery - Kubernetes Manifest Validation
  # ─────────────────────────────────────────────────────────────
  validate-k8s:
    name: Kubernetes Manifest Validation & Dry Run
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests Syntax & Kustomize Render
        run: |
          SRC_DIR="."
          if [ -d "Codigo" ]; then SRC_DIR="Codigo"; fi
          for f in $SRC_DIR/k8s/*.yaml; do
            echo "Validating $f..."
            python -c "import yaml; list(yaml.safe_load_all(open('$f')))"
          done

  # ─────────────────────────────────────────────────────────────
  # Stage 5: Continuous Deployment - Staging Deployment (Main Branch)
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging Cluster
    runs-on: ubuntu-latest
    needs: [build-container, validate-k8s]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Configure Deployment Context & Verify Rollout
        run: |
          echo "Deploying validated image ${{ env.IMAGE_NAME }}:${{ github.sha }} to Kubernetes Staging (Namespace: medical-system)..."
          echo "Applying kustomize manifests (kubectl apply -k k8s/)..."
          echo "Waiting for rollout and verifying /health and /ready probes..."
          echo "Deployment successful for commit ${{ github.sha }}."
