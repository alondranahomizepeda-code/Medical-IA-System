version: '3.8'

services:
  medical-ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: medical-ai-system:1.0.0
    container_name: medical_ai_api_container
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=medical-ai-production-super-secret-key-2024
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - TZ=America/Mexico_City
      - LOG_LEVEL=INFO
    volumes:
      # Persistent clinical storage
      - medical_data:/app/data
      - medical_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M

volumes:
  medical_data:
    driver: local
  medical_logs:
    driver: local
