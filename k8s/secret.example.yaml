apiVersion: v1
kind: Secret
metadata:
  name: medical-ai-secret
  namespace: medical-system
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_PRODUCTION_CSPRNG_SECRET"
  POSTGRES_USER: "medical_ai"
  POSTGRES_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  POSTGRES_DB: "medical_ai_prod"
  DATABASE_URL: "postgresql+psycopg2://medical_ai:REPLACE_WITH_DB_PASSWORD@postgres-service:5432/medical_ai_prod"
